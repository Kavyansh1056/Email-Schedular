version: "3.9"

# Infrastructure only. The API and worker are run directly with `npm run dev:*`
# (not containerized) so the assignment reviewer can iterate quickly without
# rebuilding images. This is documented as a trade-off in README.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ejs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ejs
      POSTGRES_PASSWORD: ejs_password
      POSTGRES_DB: email_job_scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ejs -d email_job_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ejs-redis
    restart: unless-stopped
    # AOF persistence so delayed BullMQ jobs and rate-limit/dedupe keys survive
    # a container restart (see "Restart persistence" in README.md).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ejs-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  es_data:
